repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Kept in step with the ruff version resolved in uv.lock, so the hook and CI
    # enforce the same formatting rules.
    rev: v0.16.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
        exclude: '\.coverage$'
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: https://github.com/pre-commit/mirrors-mypy
    # Kept in step with the mypy version resolved in uv.lock.
    rev: v2.3.1
    hooks:
      - id: mypy
        # Scoped to bot/ and core/ because that is the gate this hook duplicates: CI
        # runs `mypy bot core` and `make lint` runs the same. Left to run on every
        # changed file, `strict = true` turns the un-annotated test suite into 200-odd
        # errors, which is a different and unenforced bar than the one the project
        # actually holds itself to -- a hook that always fails is a hook people skip.
        name: mypy
        files: ^(bot|core)/
        # Pinned to the exact versions in uv.lock. Unpinned entries here mean the hook
        # builds an isolated environment that resolves whatever the index offers on the
        # day it runs, so a green mypy hook says nothing about whether the locked
        # toolchain type-checks. Regenerate this list with `uv lock` + `uv tree` when a
        # dependency changes.
        additional_dependencies:
          - aiogram==3.31.0
          - aiohttp==3.14.3
          - yt-dlp==2026.8.19
          - gallery-dl==1.32.14
          - python-dotenv==1.2.3
