# Production Compose stack for Scraping-Bot.
#
#   docker compose -f docker-compose.prod.yml up -d
#
# Provide BOT_TOKEN and ALLOWED_USERS through your secret manager or a .env file
# that is never committed. REDIS_URL is optional: without it, rate limiting is
# per-replica and in-memory; with it, multiple bot replicas share one namespace.
#
# The downloads directory and the bot log are mapped to persistent host paths so
# a restart does not lose in-flight jobs or history.

services:
  redis:
    image: redis:7.2-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks:
      - scraping-bot-net
    restart: unless-stopped
    # Redis is only needed for distributed rate limiting across replicas.
    # A single-replica deployment can drop this service and unset REDIS_URL.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  bot:
    build:
      context: .
      dockerfile: ./Dockerfile
    image: scraping-bot:${SCRAPING_BOT_VERSION:-latest}
    depends_on:
      redis:
        condition: service_healthy
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      ALLOWED_USERS: ${ALLOWED_USERS}
      ALLOW_PUBLIC: ${ALLOW_PUBLIC:-0}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      HEALTH_BIND: 0.0.0.0
      HEALTH_PORT: 8080
      DOWNLOAD_DIR: /app/downloads
      CONCURRENT_DOWNLOADS: ${CONCURRENT_DOWNLOADS:-2}
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-50}
      MAX_DURATION_SECONDS: ${MAX_DURATION_SECONDS:-600}
      SUBPROCESS_TIMEOUT: ${SUBPROCESS_TIMEOUT:-180}
      FFPROBE_TIMEOUT: ${FFPROBE_TIMEOUT:-10}
      MAX_DISK_USAGE_PERCENT: ${MAX_DISK_USAGE_PERCENT:-85}
      BOT_MODE: ${BOT_MODE:-webhook}
      WEBHOOK_URL: ${WEBHOOK_URL}
      RENDER_EXTERNAL_HOSTNAME: ${RENDER_EXTERNAL_HOSTNAME}
    networks:
      - scraping-bot-net
    ports:
      - "8080:8080"
    volumes:
      - scraping-bot-downloads:/app/downloads
      - scraping-bot-logs:/app/logs
    restart: unless-stopped
    user: "1000:1000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      start-period: 10s
      retries: 3

networks:
  scraping-bot-net:
    driver: bridge

volumes:
  scraping-bot-downloads:
    driver: local
  scraping-bot-logs:
    driver: local
