services:
  - type: web
    name: tg-video-dl-bot
    runtime: docker
    plan: free
    branch: main
    rootDir: .
    dockerfilePath: ./Dockerfile
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: DOWNLOAD_DIR
        value: /app/downloads
      - key: CONCURRENT_DOWNLOADS
        value: "2"
      - key: MAX_FILE_SIZE_MB
        value: "50"
      - key: ALLOWED_USERS
        # Prompted once when the blueprint is first applied; Render then ignores the
        # key and preserves whatever the dashboard holds. Leave empty for a public bot.
        sync: false
      - key: SUBPROCESS_TIMEOUT
        value: "180"
      - key: FFPROBE_TIMEOUT
        value: "10"
      - key: HEALTH_BIND
        value: "0.0.0.0"
      # PORT and RENDER_EXTERNAL_HOSTNAME are deliberately absent: Render injects
      # both, and core/config.py prefers PORT over HEALTH_PORT for the health server.
    healthCheckPath: /health
