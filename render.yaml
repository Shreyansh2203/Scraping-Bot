services:
  - type: web
    name: tg-video-dl-bot
    runtime: docker
    plan: free
    branch: main
    rootDir: .
    dockerfilePath: ./Dockerfile
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: DOWNLOAD_DIR
        value: /app/downloads
      - key: CONCURRENT_DOWNLOADS
        value: "2"
      - key: MAX_FILE_SIZE_MB
        value: "50"
      - key: ALLOWED_USERS
        # Prompt on deploy: comma-separated Telegram user IDs. Leave empty for a public bot.
        sync: false
      - key: SUBPROCESS_TIMEOUT
        value: "180"
      - key: FFPROBE_TIMEOUT
        value: "10"
      - key: HEALTH_BIND
        value: "0.0.0.0"
    healthCheckPath: /health
