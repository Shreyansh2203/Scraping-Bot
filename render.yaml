services:
  - type: web
    name: tg-video-dl-bot
    runtime: docker
    plan: free
    branch: main
    rootDir: .
    dockerfilePath: ./Dockerfile
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: DOWNLOAD_DIR
        value: /app/downloads
      - key: CONCURRENT_DOWNLOADS
        value: "2"
      - key: MAX_FILE_SIZE_MB
        value: "50"
      - key: ALLOWED_USERS
        value: ""  # comma-separated Telegram user IDs, empty = public
      - key: HEALTH_BIND
        value: "0.0.0.0"
    healthCheckPath: /health
