name: Dependency Audit

# The pull-request run in ci.yml only sees the dependency set as it stood when the
# branch was cut. Advisories for packages that are already released get published
# afterwards, so this re-scans the current main weekly and fails the build when a
# known vulnerability turns up in something the image ships.
on:
  schedule:
    - cron: "23 5 * * 1" # Mondays, 05:23 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pip-audit:
    name: pip-audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install "pip-audit>=2.6.0"

      - name: Audit the declared dependencies
        run: pip-audit --progress-spinner off .
