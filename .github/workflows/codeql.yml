name: CodeQL Security Scan

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "41 3 * * 2" # Tuesdays, 03:41 UTC

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # actions: read is what the CodeQL actions need to fetch the query bundle and
      # report results back. security-events: write is what lets the analysis upload
      # alerts. Nothing else is granted.
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        # `actions` covers the workflows in .github/workflows, which is where the
        # unpinned-action and injection classes of bug actually live in this repository.
        # `python` covers bot/ and core/. Neither needs a build step: CodeQL extracts
        # Python and workflow sources directly.
        language: ["python", "actions"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3.38.2
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3.38.2
        with:
          category: "/language:${{ matrix.language }}"
