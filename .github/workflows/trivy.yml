name: Container vulnerability scan

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    # Weekly scan so new advisories in already-deployed images are surfaced.
    - cron: "0 2 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  trivy-scan:
    name: Trivy container scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build container image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          load: true
          push: false
          tags: scraping-bot:trivy
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@01957100598a152c5ccb5017f3d60c26db162a44 # 0.29.0
        with:
          image: "scraping-bot:trivy"
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          # Critical and high are the floor: a container image shipping a high-severity
          # vulnerability is not deployable. Moderate and lower are advisory only.
          severities: "CRITICAL,HIGH"
          vuln-type: "os,library"
