name: Release Pipeline

on:
  push:
    branches: ["main"]

# Not cancel-in-progress: a half-finished release run has already pushed a tag, and
# killing the second run would leave the branch released but the image unpublished.
concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# contents and pull-requests are what release-please needs. packages: write is NOT here:
# it is scoped to the publish-docker job, which is the only thing that talks to ghcr.io.
permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # This automatically parses Conventional Commits to bump version & changelog
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-docker:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release-please.outputs.tag_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release-please.outputs.tag_name }}
            type=raw,value=latest

      # ONE build. The image is tagged with the release tags and with a local scan tag
      # at the same time, loaded into the runner's image store, and never rebuilt. The
      # previous pipeline built `local-scan-image:latest`, scanned it, and then ran a
      # *second* build-push-action to produce the released image, so nothing tied the
      # bytes Trivy cleared to the bytes that were published.
      #
      # sbom and provenance are native inputs on this major rather than a separate
      # attest-build-provenance step: they are attached to the image index this build
      # produces, and the `docker push` below carries that index to the registry as-is.
      - name: Build the release image once, with SBOM and provenance
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          load: true
          push: false
          tags: |
            local-scan-image:latest
            ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record the digest that was scanned
        id: scan
        run: |
          # Pin the exact image Trivy is about to clear, so the push step cannot be
          # pointed at something else between the scan and the publish.
          digest="$(docker image inspect local-scan-image:latest --format '{{index .Id}}')"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "scanning local-scan-image:latest (${digest})"
          docker image inspect "${digest}" --format '{{.Os}}/{{.Architecture}} {{.Config.User}}'

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: 'local-scan-image:latest'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Push the scanned image to the registry
        run: |
          set -euo pipefail
          # The tags come from the same metadata step the loaded image was tagged with,
          # so this publishes exactly the bytes Trivy just cleared. No rebuild happens
          # between the scan and the push, which is the whole point.
          pushed=0
          while read -r tag; do
            [ -n "${tag}" ] || continue
            echo "Pushing ${tag}"
            docker push "${tag}"
            pushed=$((pushed + 1))
          done <<< "${{ steps.meta.outputs.tags }}"
          if [ "${pushed}" -eq 0 ]; then
            echo "::error::metadata-action produced no tags; nothing was published"
            exit 1
          fi
          echo "published ${pushed} tag(s) from local-scan-image:latest"
